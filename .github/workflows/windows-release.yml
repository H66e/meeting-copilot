name: windows-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 与 packaging/version.txt 对应的发布标签，例如 v0.2.1
        required: true
        default: v0.2.1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content packaging/version.txt -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "标签 $env:RELEASE_TAG 与版本 $version 不一致" }
      - name: Install runtime and packaging dependencies
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install --no-cache-dir -r requirements.txt pyinstaller
      - name: Run offline tests
        shell: bash
        run: |
          python tests/test_audio_asr.py && \
          python tests/test_brain_vision.py && \
          python tests/test_ui_hotkeys.py && \
          python tests/test_scenarios.py && \
          python tests/test_packaging.py
      - name: Build, smoke-test and package
        shell: bash
        run: MC_OFFLINE=1 python tools/build_windows.py
      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -Path dist/*.zip,dist/*.sha256 | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw "发布资产数量不正确：$($assets.Count)" }
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $assets --repo "$env:GH_REPO" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $assets --repo "$env:GH_REPO" --title "Meeting Copilot $env:RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
